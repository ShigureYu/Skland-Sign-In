name: Keepalive Workflow

on:
  schedule:
    - cron: '0 0 1 * *' # 每月 1 号运行一次
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 切换到一个独立的 keepalive 分支上提交，绝不污染主分支 history
      - name: Keepalive on separate branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B keepalive-bot
          date > keepalive.txt
          git add keepalive.txt
          git commit -m "Chore: Keepalive [skip ci]" || exit 0
          git push origin keepalive-bot --force
